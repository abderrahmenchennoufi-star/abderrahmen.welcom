
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>NOVA | شبكة اجتماعية</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#09090d;
  color:#f5f5fb;
}
header{
  position:sticky;top:0;
  background:#111118;
  border-bottom:1px solid #30303b;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:26px;font-weight:bold;
  letter-spacing:3px;color:#bba7ff;
}
button,input,textarea{font:inherit}
button{
  cursor:pointer;border:0;
  padding:11px 16px;border-radius:10px;
  background:#a78bfa;color:#171022;
  font-weight:bold;
}
.layout{
  max-width:1100px;margin:auto;
  padding:22px;display:grid;
  grid-template-columns:200px minmax(0,650px);
  gap:22px;
}
.panel,.post,.composer{
  background:#14141c;border:1px solid #30303b;
  border-radius:18px;padding:17px;margin-bottom:16px;
}
nav button{
  display:block;width:100%;margin-bottom:8px;
  text-align:right;background:#20202b;color:white;
}
h1{font-size:25px}
.muted{color:#9999aa;font-size:13px}
textarea,input{
  background:#0d0d13;color:white;
  border:1px solid #353544;border-radius:10px;
  padding:12px;width:100%;outline:none;
}
textarea{resize:vertical;min-height:85px}
.composer button{margin-top:10px}
.post-head{
  display:flex;align-items:center;gap:10px;
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#d8b4fe,#6d5dfc);
  color:#171022;display:grid;place-items:center;
  font-weight:bold;
}
.post-text{line-height:1.9;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{background:#242431;color:#ddd}
.actions button.liked{color:#ff8bab}
.page{display:none;animation:appear .3s}
.page.active{display:block}
@keyframes appear{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
#toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  background:#29243b;padding:12px 18px;
  border-radius:12px;display:none;
}
.mobile-nav{display:none}
@media(max-width:700px){
  .layout{display:block;padding:13px 10px 85px}
  .sidebar{display:none}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    justify-content:space-around;padding:10px 3px;
    background:#111118;border-top:1px solid #30303b;
  }
  .mobile-nav button{padding:9px;font-size:12px}
  header{padding:13px}
}
</style>
</head>
<body>
<header>
  <div class="logo">✦ NOVA</div>
  <button onclick="showPage('profile')">حسابي</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="panel">
      <nav>
        <button onclick="showPage('home')">⌂ الرئيسية</button>
        <button onclick="showPage('explore')">⌕ استكشاف</button>
        <button onclick="showPage('profile')">◉ الملف الشخصي</button>
        <button onclick="showPage('saved')">♧ المحفوظات</button>
      </nav>
      <p class="muted">مساحتك. مجتمعك. قصتك.</p>
    </div>
  </aside>

  <main>
    <section id="home" class="page active">
      <h1>مرحبًا بك في NOVA ✨</h1>
      <p class="muted">شارك أفكارك واكتشف مجتمعًا جديدًا.</p>

      <div class="composer">
        <textarea id="postText" maxlength="600"
          placeholder="ما الذي يدور في ذهنك؟"></textarea>
        <button onclick="createPost()">＋ نشر المشاركة</button>
      </div>
      <div id="feed"></div>
    </section>

    <section id="explore" class="page">
      <h1>استكشف NOVA</h1>
      <input id="search" placeholder="ابحث في المنشورات..."
        oninput="renderPosts()">
      <div id="results"></div>
    </section>

    <section id="profile" class="page">
      <h1>ملفي الشخصي</h1>
      <div class="panel">
        <div class="avatar" id="profileAvatar">ن</div>
        <h2 id="profileName">عضو NOVA</h2>
        <p class="muted">مساحتك الخاصة على NOVA</p>
        <button onclick="editProfile()">تعديل الملف</button>
      </div>
      <h2>منشوراتي</h2>
      <div id="myPosts"></div>
    </section>

    <section id="saved" class="page">
      <h1>المحفوظات ♧</h1>
      <div id="savedPosts"></div>
    </section>
  </main>
</div>

<div class="mobile-nav">
  <button onclick="showPage('home')">⌂ الرئيسية</button>
  <button onclick="showPage('explore')">⌕ بحث</button>
  <button onclick="showPage('profile')">◉ حسابي</button>
  <button onclick="showPage('saved')">♧ محفوظات</button>
</div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let user={name:"عضو NOVA",initial:"ن"};
let posts=[];
let saved=new Set();
let liked=new Set();

try{
  user=JSON.parse(localStorage.getItem("novaUser"))||user;
  posts=JSON.parse(localStorage.getItem("novaPosts"))||[];
  saved=new Set(JSON.parse(localStorage.getItem("novaSaved"))||[]);
  liked=new Set(JSON.parse(localStorage.getItem("novaLiked"))||[]);
}catch(e){}

function persist(){
  try{
    localStorage.setItem("novaUser",JSON.stringify(user));
    localStorage.setItem("novaPosts",JSON.stringify(posts));
    localStorage.setItem("novaSaved",JSON.stringify([...saved]));
    localStorage.setItem("novaLiked",JSON.stringify([...liked]));
  }catch(e){}
}

function notify(message){
  $("toast").textContent=message;
  $("toast").style.display="block";
  setTimeout(()=>$("toast").style.display="none",2200);
}

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>
    p.classList.toggle("active",p.id===id)
  );
  if(id==="explore")renderPosts();
  if(id==="profile")renderProfile();
  if(id==="saved")renderSaved();
  window.scrollTo({top:0,behavior:"smooth"});
}

function escapeHTML(text){
  return String(text).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

function card(post){
  return `
    <article class="post">
      <div class="post-head">
        <div class="avatar">${escapeHTML(post.initial)}</div>
        <div><strong>${escapeHTML(post.author)}</strong>
        <div class="muted">${escapeHTML(post.time)}</div></div>
      </div>
      <p class="post-text">${escapeHTML(post.text)}</p>
      <div class="actions">
        <button class="${liked.has(post.id)?"liked":""}"
          onclick="toggleLike('${post.id}')">
          ${liked.has(post.id)?"♥":"♡"} ${post.likes} إعجاب
        </button>
        <button onclick="toggleSave('${post.id}')">
          ${saved.has(post.id)?"🔖 محفوظ":"♧ حفظ"}
        </button>
      </div>
    </article>`;
}

function createPost(){
  const text=$("postText").value.trim();
  if(!text){notify("اكتب منشورًا أولًا");return;}
  posts.unshift({
    id:String(Date.now()),
    author:user.name,
    initial:user.initial,
    text,
    time:"الآن",
    likes:0
  });
  $("postText").value="";
  persist();
  renderPosts();
  notify("تم نشر المشاركة على هذا الجهاز");
}

function toggleLike(id){
  const p=posts.find(x=>x.id===id);
  if(!p)return;
  if(liked.has(id)){
    liked.delete(id);p.likes=Math.max(0,p.likes-1);
  }else{
    liked.add(id);p.likes++;
  }
  persist();renderPosts();
}

function toggleSave(id){
  saved.has(id)?saved.delete(id):saved.add(id);
  persist();renderPosts();renderSaved();
  notify(saved.has(id)?"تم حفظ المنشور":"تم إلغاء الحفظ");
}

function renderPosts(){
  const q=($("search")?.value||"").toLowerCase();
  const filtered=posts.filter(p=>
    (p.text+" "+p.author).toLowerCase().includes(q)
  );
  $("feed").innerHTML=posts.length?
    posts.map(card).join(""):
    '<div class="panel">لا توجد منشورات بعد. كن أول من يشارك! ✨</div>';
  $("results").innerHTML=filtered.length?
    filtered.map(card).join(""):
    '<div class="panel">لا توجد نتائج مطابقة.</div>';
  renderProfile();
  renderSaved();
}

function renderProfile(){
  $("profileName").textContent=user.name;
  $("profileAvatar").textContent=user.initial;
  $("myPosts").innerHTML=posts.filter(p=>p.author===user.name)
    .map(card).join("")||'<p class="muted">لم تنشر شيئًا بعد.</p>';
}

function renderSaved(){
  $("savedPosts").innerHTML=posts.filter(p=>saved.has(p.id))
    .map(card).join("")||'<p class="muted">لا توجد منشورات محفوظة.</p>';
}

function editProfile(){
  const name=prompt("اكتب الاسم الذي تريد عرضه:",user.name);
  if(!name||!name.trim())return;
  user.name=name.trim();
  user.initial=[...user.name][0];
  posts.forEach(p=>{
    if(p.author===user.name)p.initial=user.initial;
  });
  persist();renderPosts();notify("تم تحديث الملف الشخصي");
}

renderPosts();
</script>
</body>
</html>
